<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>PDF Studio</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202331;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}header{height:62px;background:white;border-bottom:1px solid #e4e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:3}.brand{font-size:21px;font-weight:850}.brand span{color:#4355c7}main{max-width:1400px;margin:auto;padding:24px}.sub,.muted{color:#687083}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab,button{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;background:#edf0f7;color:#202331;white-space:nowrap}.tab.active{background:#eef0ff;color:#4355c7;outline:1px solid #dfe2ff}button.primary{background:#4355c7;color:white}button.danger{background:#fff0ef;color:#b42318}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}.panel{background:white;border:1px solid #e4e7ef;border-radius:18px;padding:17px;min-width:0}.panel h2{font-size:17px;margin:0 0 14px}.drop{border:1.5px dashed #b9c1d7;border-radius:14px;padding:22px 12px;text-align:center;background:#fafbff}.drop p,.hint{font-size:12px;color:#687083}.file{display:flex;align-items:center;gap:8px;border:1px solid #e4e7ef;border-radius:10px;padding:9px;margin-top:8px}.file .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.file button{padding:5px 8px;font-size:12px}.field{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:10px;border:1px solid #e4e7ef;border-radius:10px;background:white;font:inherit}.notice{margin-top:14px;padding:10px;border-radius:11px;background:#f2f5ff;color:#48527c;font-size:12px}.status{font-size:12px;color:#687083;margin-top:10px;min-height:18px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar h2{margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.card{border:1px solid #e4e7ef;border-radius:12px;padding:8px;background:white}.card.sel{outline:2px solid #4355c7;background:#f8f8ff}.thumb{height:160px;background:#f0f1f5;display:grid;place-items:center;overflow:hidden;border-radius:7px;cursor:pointer}.thumb canvas{max-width:100%;max-height:100%}.card small{display:block;text-align:center;color:#687083;margin:7px}.card button{width:100%;padding:6px;font-size:12px}.empty{text-align:center;padding:55px 12px;color:#687083}.modal{display:none;position:fixed;inset:0;background:#111827ed;z-index:10;color:white;flex-direction:column}.modal.open{display:flex}.modal header{background:#171b29;color:white}.modal header button{background:#ffffff22;color:white}.modal .view{flex:1;display:grid;place-items:center;overflow:auto;padding:12px}.modal canvas{max-width:96vw;max-height:calc(100vh - 110px);background:white}.modal footer{display:flex;justify-content:center;gap:14px;padding:10px}.modal footer button{background:#ffffff22;color:white}@media(max-width:800px){main{padding:16px}.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:190px}}@media(max-width:430px){header{padding:0 14px}.grid{gap:8px}.thumb{height:160px}.toolbar button{font-size:12px;padding:8px}}
</style></head><body>
<header><div class="brand">PDF <span>Studio</span></div><button id="clear">すべて閉じる</button></header>
<main><h1>PDFを、自由に編集。</h1><p class="sub">分割・結合・見開き変換・ページ整理をブラウザ内で。</p>
<nav class="tabs"><button class="tab active" data-mode="edit">ページ編集</button><button class="tab" data-mode="split">PDF分割</button><button class="tab" data-mode="merge">PDF結合</button><button class="tab" data-mode="spread">見開き変換</button></nav>
<div class="layout"><aside class="panel"><h2>PDFファイル</h2><div class="drop" id="drop"><div style="font-size:28px">＋</div><b>PDFを追加</b><p>ファイルをドロップするか選択</p><button class="primary" id="pick">ファイルを選択</button><input id="input" type="file" accept=".pdf,application/pdf" multiple hidden></div><div id="files"></div><div id="controls"></div><div class="notice">🔒 PDFは端末のブラウザ内で処理し、サーバーへ送信しません。</div><div class="status" id="status"></div></aside>
<section class="panel"><div class="toolbar"><h2 id="pageTitle">ページ一覧</h2><div class="actions"><button id="all">全選択</button><button id="preview">プレビュー</button><button class="primary" id="export">PDFを書き出す</button></div></div><div class="grid" id="pages"><div class="empty">📄<br>PDFを追加してください</div></div></section></div></main>
<div class="modal" id="modal"><header><b id="modalName">プレビュー</b><button id="close">閉じる ✕</button></header><div class="view"><canvas id="big"></canvas></div><footer><button id="prev">← 前へ</button><span id="count"></span><button id="next">次へ →</button></footer></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),{PDFDocument,degrees}=PDFLib;pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let files=[],pages=[],selected=new Set(),mode='edit',previewAt=0;
const say=t=>$('status').textContent=t,uid=()=>Math.random().toString(36).slice(2);
$('pick').onclick=()=>$('input').click();$('input').onchange=e=>{add([...e.target.files]);e.target.value=''};
$('drop').ondragover=e=>{e.preventDefault();$('drop').style.background='#eef0ff'};$('drop').ondragleave=()=> $('drop').style.background='';$('drop').ondrop=e=>{e.preventDefault();$('drop').style.background='';add([...e.dataTransfer.files])};
async function add(list){let valid=list.filter(f=>f.name.toLowerCase().endsWith('.pdf'));for(const f of valid){try{let bytes=await f.arrayBuffer(),doc=await PDFDocument.load(bytes),dimensions=doc.getPages().map(p=>p.getSize());files.push({id:uid(),name:f.name,bytes,count:doc.getPageCount(),dimensions})}catch(e){say(f.name+' を読み込めませんでした（暗号化・破損の可能性）。')}}renderFiles();await rebuild();say(valid.length+'件のPDFを読み込みました')}
function renderFiles(){$('files').innerHTML=files.map((f,i)=>'<div class="file"><span>📕</span><span class="name">'+f.name.replace(/[&<>"]/g,'')+' · '+f.count+'p</span><button data-up="'+i+'">↑</button><button data-down="'+i+'">↓</button><button class="danger" data-del="'+f.id+'">×</button></div>').join('');$('files').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{disposePdf(b.dataset.del);files=files.filter(f=>f.id!==b.dataset.del);renderFiles();rebuild()});$('files').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));$('files').querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}
function move(i,d){let j=i+d;if(j<0||j>=files.length)return;[files[i],files[j]]=[files[j],files[i]];renderFiles();rebuild()}
async function rebuild(){pages=[];for(const f of files)for(let i=0;i<f.count;i++)pages.push({id:uid(),fid:f.id,index:i,rotation:0,width:f.dimensions[i].width,height:f.dimensions[i].height});selected=new Set(pages.map(p=>p.id));await renderPages()}
const pdfCache=new Map();let thumbObserver=null,thumbQueue=Promise.resolve();
async function disposePdf(id){const task=pdfCache.get(id);pdfCache.delete(id);if(task)thumbQueue=thumbQueue.then(async()=>{try{(await task).destroy()}catch(e){}})}
async function getPdf(f){if(!pdfCache.has(f.id)){const task=pdfjsLib.getDocument({data:new Uint8Array(f.bytes.slice(0))});pdfCache.set(f.id,task.promise.catch(e=>{pdfCache.delete(f.id);throw e}))}return pdfCache.get(f.id)}
async function draw(p,c,maxW,maxH,quality=1){let f=files.find(x=>x.id===p.fid);if(!f)throw Error('元のPDFが見つかりません');let pdf=await getPdf(f),pg=await pdf.getPage(p.index+1),v=pg.getViewport({scale:1,rotation:p.rotation}),scale=Math.min(maxW/(p.cropSide?v.width/2:v.width),maxH/v.height,quality),vp=pg.getViewport({scale,rotation:p.rotation}),fullW=Math.max(1,Math.floor(vp.width)),fullH=Math.max(1,Math.floor(vp.height)),halfW=Math.max(1,Math.floor(fullW/2));c.width=p.cropSide?halfW:fullW;c.height=fullH;let transform=p.cropSide?[1,0,0,1,(p.cropSide==='right'?-halfW:0),0]:null;await pg.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp,transform}).promise;pg.cleanup()}
function splitSpreadPage(id){let i=pages.findIndex(p=>p.id===id);if(i<0)return;let p=pages[i];if(p.cropSide||p.width/p.height<1.32)return;let left={...p,id:uid(),cropSide:'left'},right={...p,id:uid(),cropSide:'right'};pages.splice(i,1,left,right);selected.delete(id);selected.add(left.id);selected.add(right.id);renderPages();say('見開きページを左右2ページに分割しました')}
async function renderPages(){let root=$('pages');if(thumbObserver){thumbObserver.disconnect();thumbObserver=null}root.querySelectorAll('canvas').forEach(c=>{c.width=0;c.height=0});$('pageTitle').textContent='ページ一覧（'+pages.length+'ページ）';if(!pages.length){root.innerHTML='<div class="empty">PDFを追加してください</div>';return}root.innerHTML=pages.map((p,i)=>{let candidate=!p.cropSide&&p.width/p.height>=1.32;return '<div class="card '+(selected.has(p.id)?'sel':'')+'" data-card="'+p.id+'"><div class="thumb" data-open="'+i+'"><span class="muted">読み込み待機中</span></div><small>'+(i+1)+'ページ目'+(p.cropSide?'（'+(p.cropSide==='left'?'左':'右')+'半分）':'')+'</small>'+(candidate?'<div class="hint" style="text-align:center;color:#4355c7;margin:4px 0">見開き候補</div><button data-split="'+p.id+'">このページを左右に分割</button>':'')+'<button data-rot="'+p.id+'">回転 ↻</button><button class="danger" data-rm="'+p.id+'">削除</button></div>'}).join('');root.querySelectorAll('[data-card]').forEach(el=>el.onclick=e=>{if(e.target.closest('button')||e.target.closest('.thumb'))return;let id=el.dataset.card;selected.has(id)?selected.delete(id):selected.add(id);el.classList.toggle('sel',selected.has(id))});root.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>open(+el.dataset.open));root.querySelectorAll('[data-rot]').forEach(b=>b.onclick=()=>{let p=pages.find(x=>x.id===b.dataset.rot);if(p){p.rotation=(p.rotation+90)%360;renderPages()}});root.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>splitSpreadPage(b.dataset.split));root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{pages=pages.filter(p=>p.id!==b.dataset.rm);selected.delete(b.dataset.rm);renderPages()});const thumbs=[...root.querySelectorAll('.thumb')];const renderThumb=el=>{let i=+el.dataset.open,p=pages[i];if(!p||el.dataset.loading||el.querySelector('canvas'))return;el.dataset.loading='1';let c=document.createElement('canvas');el.replaceChildren(c);thumbQueue=thumbQueue.then(async()=>{if(!el.isConnected||!pages[i]||pages[i].id!==p.id)return;try{await draw(p,c,el.clientWidth||140,el.clientHeight||160,.85)}catch(e){if(el.isConnected)el.textContent='表示できません'}finally{delete el.dataset.loading}})};if('IntersectionObserver'in window){thumbObserver=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){thumbObserver.unobserve(entry.target);renderThumb(entry.target)}},{rootMargin:'450px 0px'});thumbs.forEach(el=>thumbObserver.observe(el))}else thumbs.forEach(renderThumb)}
$('all').onclick=()=>{selected=new Set(pages.map(p=>p.id));renderPages()};function open(i){previewAt=i;$('modal').classList.add('open');showPreview()}async function showPreview(){let p=pages[previewAt];if(!p)return;$('modalName').textContent=files.find(f=>f.id===p.fid).name;$('count').textContent=(previewAt+1)+' / '+pages.length;await draw(p,$('big'),innerWidth-40,innerHeight-130)}$('preview').onclick=()=>{let i=pages.findIndex(p=>selected.has(p.id));if(i>=0)open(i);else say('ページを選択してください')};$('close').onclick=()=>$('modal').classList.remove('open');$('prev').onclick=()=>{if(previewAt>0){previewAt--;showPreview()}};$('next').onclick=()=>{if(previewAt<pages.length-1){previewAt++;showPreview()}};
function controls(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let c=$('controls');if(mode==='edit')c.innerHTML='<label class="field">ページ編集</label><p class="hint">ページを選択し、回転・削除できます。選択したページをPDFとして保存します。</p><button id="reverse">ページ順を逆にする</button>';if(mode==='split')c.innerHTML='<label class="field">分割方法</label><select id="splitType"><option value="range">ページ範囲ごとに分割</option><option value="each">1ページずつ分割</option><option value="selected">選択ページを1ファイルに</option></select><label class="field">ページ範囲（例：1-3,4-6,8）</label><input id="ranges" placeholder="空欄なら1ページずつ"><label class="field">ファイル名</label><input id="prefix" value="分割PDF">';if(mode==='merge')c.innerHTML='<label class="field">結合ファイル名</label><input id="outname" value="結合PDF.pdf"><p class="hint">左の↑↓でPDFの結合順を変更できます。</p>';if(mode==='spread')c.innerHTML='<label class="field">変換方向</label><select id="spreadType"><option value="split">見開き1ページを左右2ページに分割</option><option value="join">2ページを横に並べて1ページに結合</option></select><label class="field">左右の順番</label><select id="spreadOrder"><option value="normal">左→右</option><option value="reverse">右→左</option></select><label class="field">用紙サイズ</label><select id="paper"><option value="A4">A4分割 / A3結合</option><option value="A5">A5分割 / A4結合</option></select><p class="hint">分割はページ中央で左右に切り出します。結合は各ページを横に並べます。</p>';let r=$('reverse');if(r)r.onclick=()=>{pages.reverse();renderPages()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;controls()});controls();
async function pdfFor(list){let out=await PDFDocument.create(),sources=new Map();for(let p of list){let f=files.find(x=>x.id===p.fid);if(!f)continue;if(!sources.has(f.id))sources.set(f.id,await PDFDocument.load(f.bytes));let src=sources.get(f.id);if(p.cropSide){let orig=src.getPage(p.index),box=orig.getSize(),mid=box.width/2,bounds={left:p.cropSide==='left'?0:mid,bottom:0,right:p.cropSide==='left'?mid:box.width,top:box.height},[emb]=await out.embedPages([orig],[bounds]),pg=out.addPage([emb.width,emb.height]);pg.drawPage(emb,{x:0,y:0,width:emb.width,height:emb.height});if(p.rotation)pg.setRotation(degrees(p.rotation))}else{let [cp]=await out.copyPages(src,[p.index]);if(p.rotation)cp.setRotation(degrees(p.rotation));out.addPage(cp)}}return out}
function save(bytes,name,type='application/pdf'){let u=URL.createObjectURL(new Blob([bytes],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function ranges(s,n){if(!s.trim())return Array.from({length:n},(_,i)=>[i]);return s.split(',').map(x=>{let m=x.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('ページ範囲の形式を確認してください');let a=+m[1],b=+(m[2]||m[1]);if(a<1||b<a||b>n)throw Error('ページ範囲は1～'+n+'で指定してください');return Array.from({length:b-a+1},(_,i)=>a-1+i)})}
async function exportPDF(){if(!pages.length)throw Error('先にPDFを追加してください');if(mode==='edit'){let list=pages.filter(p=>selected.has(p.id));if(!list.length)throw Error('ページを選択してください');save(await (await pdfFor(list)).save(),'編集済みPDF.pdf');return}if(mode==='merge'){save(await (await pdfFor(pages)).save(),$('outname').value||'結合PDF.pdf');return}if(mode==='split'){let t=$('splitType').value,groups=t==='each'?pages.map((p,i)=>[i]):t==='selected'?[pages.map((p,i)=>selected.has(p.id)?i:-1).filter(i=>i>=0)]:ranges($('ranges').value,pages.length);let zip=new JSZip();for(let i=0;i<groups.length;i++){if(!groups[i].length)continue;zip.file(($('prefix').value||'分割PDF')+'_'+String(i+1).padStart(2,'0')+'.pdf',await (await pdfFor(groups[i].map(ix=>pages[ix]))).save())}save(await zip.generateAsync({type:'uint8array'}),'分割PDF一式.zip','application/zip');return}
let typ=$('spreadType').value,order=$('spreadOrder').value,paper=$('paper').value,out=await PDFDocument.create(),sizes={A4:[595.28,841.89],A5:[419.53,595.28]},[w,h]=sizes[paper];if(typ==='split'){for(let p of pages){let f=files.find(x=>x.id===p.fid),src=await PDFDocument.load(f.bytes),orig=src.getPage(p.index),box=orig.getSize(),mid=box.width/2,parts=order==='normal'?[[0,mid],[mid,box.width]]:[[mid,box.width],[0,mid]];for(let [l,r] of parts){let [emb]=await out.embedPages([orig],[{left:l,bottom:0,right:r,top:box.height}]);let pg=out.addPage([w,h]),z=Math.min(w/emb.width,h/emb.height);pg.drawPage(emb,{x:(w-emb.width*z)/2,y:(h-emb.height*z)/2,width:emb.width*z,height:emb.height*z})}}}else{let W=2*w,H=h;for(let i=0;i<pages.length;i+=2){let pair=pages.slice(i,i+2),pg=out.addPage([W,H]);for(let j=0;j<pair.length;j++){let p=pair[order==='normal'?j:pair.length-1-j],f=files.find(x=>x.id===p.fid),src=await PDFDocument.load(f.bytes),[emb]=await out.embedPages([src.getPage(p.index)]),z=Math.min(w/emb.width,H/emb.height);pg.drawPage(emb,{x:j*w+(w-emb.width*z)/2,y:(H-emb.height*z)/2,width:emb.width*z,height:emb.height*z})}}}save(await out.save(),typ==='split'?'見開き分割.pdf':'見開き結合.pdf')}
$('export').onclick=async()=>{let b=$('export');b.disabled=true;say('PDFを処理しています…');try{await exportPDF();say('書き出しが完了しました')}catch(e){say(e.message||'処理に失敗しました')}finally{b.disabled=false}};
$('clear').onclick=()=>{if(files.length&&!confirm('読み込んだPDFをすべて閉じますか？'))return;files.forEach(f=>disposePdf(f.id));files=[];pages=[];selected.clear();renderFiles();renderPages();say('すべて閉じました')};
})();
</script></body></html>
